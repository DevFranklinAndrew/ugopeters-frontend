<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ugo Peters Executive</title>
    <script>
      // Apply the stored (or system) theme BEFORE first paint. React's
      // ThemeContext only runs after hydration, so without this the page paints
      // with the default light palette and then visibly wipes to dark. Keep this
      // logic in sync with the initial state in src/context/ThemeContext.tsx.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(theme);
          // Set color-scheme inline too. The class alone only takes effect once
          // the stylesheet has loaded; this paints the browser canvas in the
          // right colour from the very first frame, so there is no white flash
          // while CSS is still in flight.
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
